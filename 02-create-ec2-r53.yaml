- name: crate 3 ec2 instances, 3 private and 1 public r53 record
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    image_id: "ami-0220d79f3f480ecf5"
    sg_id: "sg-03891f88ae315b0c9"
    region: "us-east-1"
    type : "t3.micro"
    zone: "venra.online"
    instances:
      - mysql
      - backend
      - frontend
  
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: present
      executable: pip3.9
    loop: 
      - boto3
      - botocore

  - name: install 3 ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      image_id: "{{ image_id }}"
      instance_type: "{{ type }}"
      region: "{{ region }}"
      security_group: "{{ sg_id }}"
      vpc_subnet_id: "{{ subnet_id }}"
      wait: true
    loop: "{{ instances }}"
    register: ec2_info
