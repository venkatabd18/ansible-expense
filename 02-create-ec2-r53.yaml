- name: crate 3 ec2 instances, 3 private and 1 public r53 record
  hosts: local
  connection: local
  become: yes
  vars:
    subnet_id: "subnet-0e6a100cffe49897b"
    image_id: "ami-0220d79f3f480ecf5"
    sg_id: "sg-03891f88ae315b0c9"
    region: "us-east-1"
    type : "t3.micro"
    zone: "venra.online"
    instances:
      - mysql
      - backend
      - frontend
  
  tasks:
  - name: install boto3 and botocore
    ansible.builtin.pip:
      name: "{{ item }}"
      state: present
      executable: pip3.9
    loop: 
      - boto3
      - botocore

  - name: install 3 ec2 instances
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      image_id: "{{ image_id }}"
      instance_type: "{{ type }}"
      region: "{{ region }}"
      security_group: "{{ sg_id }}"
      vpc_subnet_id: "{{ subnet_id }}"
      wait: true
    loop: "{{ instances }}"
    register: ec2_info

  - name: print ec2 info to get the data for r53 record
    ansible.builtin.debug:
      msg: "{{ ec2_info }}"

  - name: create private r53 records
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}"
      value: "{{ item.instances[0].private_ip_address }}"
      type: A 
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info.results }}"

  - name: create public r53 record
    amazon.aws.route53:
      state: "present"
      zone: "{{ zone }}"
      record: "{{ zone }}"
      value: "{{ item.instances[0].public_ip_address }}"
      type: A 
      ttl: 1
      wait: true
      overwrite: true
    loop: "{{ ec2_info. results }}"
    when: item.item == "frontend"



