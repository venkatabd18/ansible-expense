- name: configure backend
  hosts: backend
  become: yes
  vars:
    login_host: mysql.venra.online
    root_password: ExpenseApp@1
    login_user: root

  tasks:
  - name: disable nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs 24
    ansible.builtin.command: dnf module enable nodejs:24 -y

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: create app dir
    ansible.builtin.file:
      name: /app
      state: "directory"

