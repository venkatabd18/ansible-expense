- name: configure backend
  hosts: backend
  become: yes
  vars:
    login_host: mysql.venra.online
    root_password: ExpenseApp@1
    login_user: root

  tasks:
  - name: disable nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs 24
    ansible.builtin.command: dnf module enable nodejs:24 -y

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: create app dir
    ansible.builtin.file:
      name: /app
      state: "directory"

  - name: create expense user 
    ansible.builtin.user:
      name: expense

  - name: download backend code
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-backend-v5.tar.gz
      dest: /tmp/backend.tar.gz

  - name: extract the backend code
    ansible.builtin.unarchive:
      src: /tmp/backend.tar.gz
      dest: /app
      remote_src: yes

  - name: install npm
    community.general.npm:
      path: /app

  - name: copy the backend service
    ansible.builtin.copy:
      src: backend.service
      dest: /etc/systemd/system/backend.service
      



  

